# 클러스터 안 주소 api-server.apm.svc.cluster.local. 같은 네임스페이스에서는 api-server:8080
# 화면 · 바깥 HTTP 입구(Ingress)는 아직 없다 : 로컬은 kubectl port-forward 로 연다 (README 로컬 절)
apiVersion: v1
kind: Service
metadata:
  name: api-server
  labels:
    app.kubernetes.io/name: api-server
    app.kubernetes.io/part-of: monimo-apm
spec:
  selector:
    app.kubernetes.io/name: api-server
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 18080
      targetPort: management
